name: macOS packages

on:
  push:
    branches: [release]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS ${{ matrix.arch }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            machine: arm64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron package
        run: pnpm electron:package
        env:
          DESKTOP_TARGET_TRIPLE: ${{ matrix.target }}

      - name: Verify browser worker
        run: pnpm desktop:sidecars:verify

      - name: Verify packaged browser worker
        run: pnpm electron:package:verify
        env:
          DESKTOP_TARGET_TRIPLE: ${{ matrix.target }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ChatDesk-macos-${{ matrix.arch }}
          path: |
            apps/electron/dist-electron/*.dmg
            apps/electron/dist-electron/*-mac.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create or reuse release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --verify-tag \
              --generate-notes \
              --title "ChatDesk $TAG_NAME"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          find release-assets -type f \( \
            -name '*.dmg' -o \
            -name '*.app.tar.gz' -o \
            -name '*.app.tar.gz.sig' \
          \) -print0 | while IFS= read -r -d '' asset; do
            gh release upload "$TAG_NAME" "$asset" --clobber
          done
